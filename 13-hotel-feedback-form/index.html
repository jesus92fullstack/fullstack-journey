<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Comentarios del Hotel</title>
  </head>

  <body>
    <header>
      <h1>Formulario de Comentarios del Hotel</h1>
      <p>
        Gracias por hospedarse con nosotros. Por favor, proporcione comentarios
        sobre su estadía reciente.
      </p>
    </header>

    <main>
      <form method="POST" action="https://hotel-feedback.freecodecamp.org">
        <fieldset>
          <legend>Información Personal</legend>

          <label for="full-name">Nombre (requerido):</label>
          <input
            type="text"
            id="full-name"
            name="name"
            placeholder="ej., Juan Pérez"
            size="20"
            required
          />

          <label for="email">Correo electrónico (requerido):</label>
          <input
            placeholder="ejemplo@email.com"
            id="email"
            type="email"
            name="email"
            size="20"
            required
          />
          <label for="age">Edad (opcional):</label>
          <input type="number" name="age" id="age" min="3" max="100" />
        </fieldset>

        <fieldset>
          <legend>¿Era esta su primera vez en nuestro hotel?</legend>
          <input id="yes-option" type="radio" name="hotel-stay" value="yes" />
          <label for="yes-option">Sí</label>
          <input id="no-option" type="radio" name="hotel-stay" value="no" />
          <label for="no-option">No</label>
        </fieldset>

        <fieldset>
          <legend>
            ¿Por qué eligió hospedarse en nuestro hotel? (Marque todas las que
            apliquen)
          </legend>

          <input type="checkbox" id="ads" name="choice" value="ads" />
          <label for="ads">Redes Sociales</label>

          <input
            type="checkbox"
            id="recommendation"
            name="choice"
            value="recommendation"
          />
          <label for="recommendation">Recomendación Personal</label>
          <input type="checkbox" id="location" name="choice" value="location" />
          <label for="location">Ubicación</label>

          <input
            checked
            type="checkbox"
            id="reputation"
            name="choice"
            value="reputation"
          />
          <label for="reputation">Reputación</label>
          <input type="checkbox" id="price" name="choice" value="price" />
          <label for="price">Precio</label>
        </fieldset>

        <fieldset>
          <legend>Calificaciones</legend>

          <label for="service">¿Cómo fue el servicio?</label>

          <select name="service" id="service">
            <option value="poor">Deficiente</option>
            <option value="satisfactory">Satisfactorio</option>
            <option value="good">Bueno</option>
            <option value="very-good">Muy Bueno</option>
            <option selected value="excellent">Excelente</option>
          </select>

          <label for="food">¿Cómo fue la comida?</label>

          <select name="food" id="food">
            <option value="poor">Deficiente</option>
            <option value="satisfactory">Satisfactorio</option>
            <option value="good">Bueno</option>
            <option value="very-good">Muy Bueno</option>
            <option selected value="excellent">Excelente</option>
          </select>
        </fieldset>

        <label for="comments">¿Otros Comentarios?</label>
        <textarea cols="30" rows="10" name="comments" id="comments"></textarea>

        <button type="submit">Enviar</button>
      </form>
    </main>
  </body>
</html>
